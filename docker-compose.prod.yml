services:
  postgres:
    image: postgres:16
    container_name: welldone_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - welldone_net

  redis:
    image: redis:7
    container_name: welldone_redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - welldone_net

  migrate:
    image: 404welldone/backend:latest
    container_name: welldone_migrate
    command: npx prisma migrate deploy
    env_file:
      - ./.env.back
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - welldone_net

  backend:
    image: 404welldone/backend:latest
    container_name: backend
    env_file:
      - ./.env.back
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - welldone_net

  frontend:
    image: 404welldone/frontend:latest
    container_name: frontend
    environment:
      API_URL: http://backend:4000
      NODE_OPTIONS: --dns-result-order=ipv4first

    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
    restart: always
    networks:
      - welldone_net

volumes:
  postgres_data:

networks:
  welldone_net:
    driver: bridge
