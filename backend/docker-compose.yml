services:
  postgres:
    image: postgres:16
    container_name: welldone_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: WelldoneApi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: welldone_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '8081:80'
    depends_on:
      - postgres
    restart: always

  redis:
    image: redis:7
    container_name: welldone_redis
    ports:
      - '6379:6379'
    restart: always

  maildev:
    image: maildev/maildev
    container_name: welldone_maildev
    ports:
      - '1080:1080'
      - '1025:1025'
    restart: always

volumes:
  postgres_data: